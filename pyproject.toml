[project]
name = "trellis-forge"
dynamic = ["version"]
description = "Batch image-to-3D with TRELLIS.2: folders of images become GLB assets — on your own GPU or the free hosted demo."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rahul Rajan" }]
keywords = ["3d", "image-to-3d", "trellis", "glb", "generative", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pillow>=10.0",
    "trimesh>=4.0",
    "numpy>=1.26",
    # The hf-space backend is the zero-GPU default path, so its client is core.
    # 2.x because the demo Space runs gradio 6, and 1.x named the auth kwarg
    # hf_token where 2.x calls it token.
    "gradio-client>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
trellis-forge = "trellis_forge.cli:app"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/trellis_forge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/trellis_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: typer.Argument/Option in signature defaults is the framework's idiom.
ignore = ["B008"]
