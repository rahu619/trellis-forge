[project]
name = "trellis-forge"
version = "0.1.0"
description = "One-stop CLI for TRELLIS.2 image-to-3D: batch folders of images into GLB/OBJ/STL assets on CUDA, Apple Silicon, or the free hosted demo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rahul Rajan" }]
keywords = ["3d", "image-to-3d", "trellis", "glb", "generative", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pillow>=10.0",
    "trimesh>=4.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Background removal for real-world photos (--rembg).
rembg = ["rembg>=2.0"]
# Free hosted backend (--backend hf-space), no GPU needed anywhere.
hf = ["gradio-client>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
trellis-forge = "trellis_forge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trellis_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: typer.Argument/Option in signature defaults is the framework's idiom.
ignore = ["B008"]
